        let displaySentences = [...rawSentences];
        let currentIdx = 0;
        let isAutoplayActive = false;
        let synth = window.speechSynthesis;

        function initVoices() {
            let voices = synth.getVoices();
            if (voices.length > 0) {
                document.getElementById('voiceStatus').innerText = "語音引擎已就緒 (Ready)";
                document.getElementById('voiceStatus').className = "text-xs bg-emerald-700 px-3 py-1 rounded-full font-normal";
            }
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = initVoices;
        }

        function renderList() {
            const container = document.getElementById('sentenceList');
            container.innerHTML = '';
            
            displaySentences.forEach((item, index) => {
                const card = document.createElement('div');
                card.id = `card-${index}`;
                card.className = `bg-white p-5 rounded-2xl shadow-sm border transition-all ${index === currentIdx ? 'border-sky-500 ring-2 ring-sky-100 bg-sky-50/20' : 'border-slate-100 hover:border-slate-200'}`;
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <div class="space-y-1">
                            <span class="text-xs font-bold text-sky-600 bg-sky-50 px-2.5 py-1 rounded-full">#${item.id}</span>
                            <h2 class="text-xl font-bold text-slate-900 pt-1">${item.es}</h2>
                            <p class="text-slate-600 text-sm">${item.en}</p>
                            ${item.note ? `<p class="text-xs italic text-amber-700 bg-amber-50 p-2 rounded-lg mt-2 inline-block">💡 筆記：${item.note}</p>` : ''}
                        </div>
                        <button onclick="playSingle(${index})" class="bg-sky-600 hover:bg-sky-700 text-white px-3 py-2 rounded-xl text-xs font-medium shadow-sm transition shrink-0">
                            🔊 播放此句
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function scrollToCurrent() {
            const el = document.getElementById(`card-${currentIdx}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function playSingle(index) {
            unlockAudio();
            isAutoplayActive = false;
            currentIdx = index;
            renderList();
            scrollToCurrent();
            playCurrentSentence();
        }

        function startAutoplay() {
            unlockAudio();
            isAutoplayActive = true;
            renderList();
            scrollToCurrent();
            playCurrentSentence();
        }

        function unlockAudio() {
            if (synth.paused) synth.resume();
            let u = new SpeechSynthesisUtterance("");
            synth.speak(u);
        }

        function playCurrentSentence() {
            synth.cancel();

            if (currentIdx >= displaySentences.length) return;

            const item = displaySentences[currentIdx];
            document.getElementById('currentPlayingText').innerText = `#${item.id} - ${item.es}`;

            const rate = parseFloat(document.getElementById('rateSelect').value);
            const isRepeatOne = document.getElementById('repeatOneCheck').checked;

            let voices = synth.getVoices();
            let esVoice = voices.find(v => v.lang === 'es-AR') || voices.find(v => v.lang.startsWith('es')) || null;
            let enVoice = voices.find(v => v.lang === 'en-US') || null;

            // 1. 朗讀阿根廷西語
            speakText(item.es, 'es-AR', esVoice, rate, () => {
                // 2. 停頓 0.4 秒後朗讀英文對照
                setTimeout(() => {
                    speakText(item.en, 'en-US', enVoice, rate, () => {
                        if (isRepeatOne) {
                            setTimeout(playCurrentSentence, 800);
                        } else if (isAutoplayActive) {
                            if (currentIdx < displaySentences.length - 1) {
                                currentIdx++;
                                renderList();
                                scrollToCurrent();
                                setTimeout(playCurrentSentence, 1000);
                            } else {
                                isAutoplayActive = false;
                                document.getElementById('currentPlayingText').innerText = "✅ 600 句全部播放完成！";
                            }
                        }
                    });
                }, 400);
            });
        }

        function speakText(text, langCode, voiceObj, rate, callback) {
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCode;
            if (voiceObj) utterance.voice = voiceObj;
            utterance.rate = rate;
            
            utterance.onend = () => { if (callback) callback(); };
            utterance.onerror = () => { if (callback) callback(); };

            synth.speak(utterance);
        }

        function pauseAudio() {
            isAutoplayActive = false;
            synth.cancel();
            document.getElementById('currentPlayingText').innerText = "已暫停播放";
        }

        function stopAudio() {
            isAutoplayActive = false;
            currentIdx = 0;
            synth.cancel();
            renderList();
            document.getElementById('currentPlayingText').innerText = "已停止播放";
        }

        function nextSentence() {
            if (currentIdx < displaySentences.length - 1) {
                currentIdx++;
                renderList();
                scrollToCurrent();
                playCurrentSentence();
            }
        }

        function prevSentence() {
            if (currentIdx > 0) {
                currentIdx--;
                renderList();
                scrollToCurrent();
                playCurrentSentence();
            }
        }

        function filterSentences() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            displaySentences = rawSentences.filter(s => 
                s.es.toLowerCase().includes(q) || 
                s.en.toLowerCase().includes(q) || 
                s.note.toLowerCase().includes(q)
            );
            currentIdx = 0;
            renderList();
        }

        window.onload = () => {
            renderList();
            initVoices();
        };
    </script>
